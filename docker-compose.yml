services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./Backend
    # we add nginx as a reverse proxy, so we don't need to expose the backend port directly
    # ports:
    #   - "8000:8000"
    env_file:
      - ./Backend/.env.docker
    depends_on:
      - db
    volumes:
      - ./Backend/static:/app/static
      - ./Backend/media:/app/media
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./Frontend
      args:
        #  after add nginx as reverse proxy, we need to change the base URL to point to nginx instead of backend directly
        # VITE_SERVER_BASE_URL: "http://localhost:8000/"
        # VITE_SERVER_BASE_URL: "http://backend:8000/"
        VITE_SERVER_BASE_URL: " "
    # ports:
    #   - "5173:80"
    depends_on:
      - backend
  # This creates a named Docker volume to permanently store PostgreSQL data.
  # Without this:
  # Database data is stored inside the container
  # If container is deleted → data is lost
  # With this:
  # Data is stored in a Docker-managed volume
  # Data persists even if container stops or restarts
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
